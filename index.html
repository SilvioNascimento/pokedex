<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      h1 {
        color: darkblue;
        font-weight: bold;
        text-align: center;
      }

      p {
        color: mediumblue;
        font-weight: lighter;
        text-align: center;
      }

      button {
        display: block;
        margin: 0 auto;
      }

      .texto {
        padding-top: 15px;
        padding-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <h1 class="texto">Meu primeiro site</h1>

    <p class="texto">Meu primeiro site está sendo feito junto de um curso da DIO</p>

    <button id="btnTeste" type="button">Teste</button>

    <script>
      //document: o conteúdo de toda a página web
      const btnTeste = document.getElementById('btnTeste')

      //Se houver um evento (no caso é um click), realize uma ação
      btnTeste.addEventListener("click", function () {
        console.log("Clicou no botão.");
      })
    </script>
  </body>
</html>
