<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <!-- Normalize.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- My CSS -->
    <link rel="stylesheet" href="./assets/css/global.css" />
    <link rel="stylesheet" href="./assets/css/pokedex.css" />
  </head>
  <body>
    <section class="content">
      <h1>Pokedex</h1>

      <ol class="pokemons">
        <li class="pokemon">
          <span class="number">#001</span>
          <span class="name">Bulbasaur</span>

          <div class="detail">
            <ol class="types">
              <li class="type">Glass</li>
              <li class="type">Poison</li>
            </ol>

            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/1.png"
              alt="Bulbasaur"
            />
          </div>
        </li>

        <li class="pokemon">
          <span class="number">#002</span>
          <span class="name">Ivysaur</span>

          <div class="detail">
            <ol class="types">
              <li class="type">Glass</li>
              <li class="type">Poison</li>
            </ol>

            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/2.png"
              alt="Ivysaur"
            />
          </div>
        </li>

        <li class="pokemon">
          <span class="number">#003</span>
          <span class="name">Venusaur</span>

          <div class="detail">
            <ol class="types">
              <li class="type">Glass</li>
              <li class="type">Poison</li>
            </ol>

            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/3.png"
              alt="Venusaur"
            />
          </div>
        </li>

        <li class="pokemon">
          <span class="number">#004</span>
          <span class="name">?</span>

          <div class="detail">
            <ol class="types">
              <li class="type">?</li>
              <li class="type">?</li>
            </ol>

            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/3.png"
              alt="?"
            />
          </div>
        </li>
      </ol>
    </section>

    <!-- My JS -->
    <script src="./assets/js/main.js"></script>
  </body>
</html>
